<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6b81,#ff9ff3,#feca57);
}

.container{
    width:90%;
    max-width:650px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    animation:fade 1.5s ease;
}

h1{
    color:#e91e63;
    margin-bottom:20px;
}

h2{
    color:#ff0066;
    margin-top:25px;
}

p{
    color:#444;
    line-height:1.8;
    margin:15px 0;
}

.buttons{
    margin-top:25px;
}

button{
    padding:15px 35px;
    margin:10px;
    border:none;
    border-radius:40px;
    font-size:18px;
    cursor:pointer;
    color:white;
    transition:.3s;
}

button:first-child{
    background:#ff0066;
}

button:last-child{
    background:#555;
}

button:hover{
    transform:scale(1.1);
}

.hearts span{
    position:absolute;
    bottom:-50px;
    font-size:30px;
    animation:float 8s linear infinite;
}

.hearts span:nth-child(1){left:10%;animation-delay:0s;}
.hearts span:nth-child(2){left:30%;animation-delay:2s;}
.hearts span:nth-child(3){left:50%;animation-delay:4s;}
.hearts span:nth-child(4){left:70%;animation-delay:1s;}
.hearts span:nth-child(5){left:90%;animation-delay:3s;}

@keyframes float{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.confetti{
    position:absolute;
    top:-30px;
    font-size:28px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(120vh) rotate(720deg);
    }
}

#result{
    margin-top:25px;
    color:#ff0066;
}
</style>

</head>
<body>

<div class="hearts">
    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💘</span>
</div>

<div class="container">
    <h1>❤️ Hey Beautiful ❤️</h1>

    <p>
        Every moment with you feels like magic.
        Your smile brightens my darkest days,
        and your laughter is my favorite melody.
    </p>

    <p>
        I don't promise perfection,
        but I promise honesty, loyalty,
        respect, and endless love.
    </p>

    <h2>Will You Be My Girlfriend? 💍</h2>

    <div class="buttons">
        <button onclick="yes()">Yes ❤️</button>
        <button onclick="no()">No 🙈</button>
    </div>

    <h2 id="result"></h2>
</div>

<script>
function yes(){
    document.getElementById("result").innerHTML =
    "🎉❤️ You just made me the happiest person alive! ❤️🎉";

    for(let i=0;i<120;i++){
        let heart=document.createElement("div");
        heart.innerHTML="❤️";
        heart.className="confetti";
        heart.style.left=Math.random()*100+"vw";
        heart.style.animationDuration=(Math.random()*2+2)+"s";
        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },4000);
    }
}

function no(){
    document.getElementById("result").innerHTML =
    "🥺 Please think once more... My answer will always be YOU ❤️";
}
</script>

</body>
</html>
